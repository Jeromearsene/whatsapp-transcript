[tool.poetry]
name = "whatsapp-transcript"
version = "0.1.0"
description = "Extract, transcribe and compile a WhatsApp conversation into Markdown, JSON or plain text"
license = "MIT"
authors = ["jeromearsene"]
readme = "README.md"
repository = "https://github.com/jeromearsene/whatsapp-transcript"
package-mode = false

[tool.poetry.dependencies]
# Tested with Python 3.12 (see the .python-version file). mlx (and therefore
# mlx-whisper) requires Apple Silicon and supports Python 3.10 through 3.15;
# this constraint follows that range without pinning an exact version.
python = ">=3.10,<3.16"
mlx-whisper = "^0.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.16"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 115

[tool.ruff.lint]
# E/F: basic pycodestyle/pyflakes errors — I: import sorting —
# UP: syntax upgrades for the targeted Python version — B: common bugs (bugbear)
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
